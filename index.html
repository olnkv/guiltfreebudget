<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guilt-Free Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2733;
    --muted:#67707B;
    --paper:#F1F2EF;
    --card:#FFFFFF;
    --line:#E3E5E0;
    --green-deep:#0F5C46;   /* €100-note green — the guilt-free bar */
    --green:#178A63;
    --blue:#3D66AC;         /* €20-note blue — budget progress */
    --red:#BC3F3F;          /* €10-note red — over budget */
    --red-deep:#7E2B2B;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    font-size:16px;
    line-height:1.45;
  }
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px 190px}
  .eyebrow{
    font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);
  }
  h1{font-weight:800;font-size:clamp(26px,6vw,34px);margin:.35em 0 .3em;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 4px}

  /* header */
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .salaryline{font-family:var(--mono);font-weight:600;font-size:15px}
  .salaryline span{color:var(--muted);font-family:var(--sans);font-weight:400}

  /* cards & rows */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-top:12px;
    box-shadow:0 1px 2px rgba(31,39,51,.04);
  }
  section{margin-top:28px}
  .sect-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .sect-note{font-size:13px;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row > input{flex:1;min-width:110px}
  .item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .item:last-of-type{border-bottom:none}
  .item .name{overflow-wrap:anywhere}
  .amount{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}

  /* inputs & buttons */
  input{
    font:inherit;color:var(--ink);
    padding:10px 12px;border:1.5px solid #D6D9D3;border-radius:10px;
    background:#FBFBFA;width:100%;
  }
  input.money{font-family:var(--mono);font-weight:500}
  input:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,102,172,.18)}
  button{
    font:inherit;font-weight:600;cursor:pointer;border-radius:10px;
    padding:10px 14px;border:1.5px solid transparent;white-space:nowrap;
  }
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .primary{background:var(--ink);color:#fff}
  .primary:hover{background:#2B3646}
  .ghost{background:transparent;border-color:var(--line);color:var(--ink)}
  .ghost:hover{background:#EDEEEA}
  .tiny{padding:5px 9px;font-size:13px;border-radius:8px}
  .x{
    background:transparent;border:none;color:var(--muted);font-size:16px;line-height:1;
    padding:6px 8px;border-radius:8px;
  }
  .x:hover{background:#F0E9E9;color:var(--red)}
  .armed{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
  .err{color:var(--red);font-size:13px;margin-top:6px}
  .hint{font-size:13px;color:var(--muted);margin-top:6px;font-family:var(--mono)}

  /* budgets */
  .budget{padding-top:14px}
  .budget + .budget{border-top:1px dashed var(--line);margin-top:14px}
  .budget-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .budget-name{font-weight:800;font-size:17px}
  .limit{font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:99px;background:#E7E9E3;margin:10px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .25s ease}
  .bar.over i{background:var(--red)}
  .status{font-size:13.5px}
  .status .over{color:var(--red);font-weight:600}
  .freed{color:var(--green);font-weight:600}
  .logs{margin:8px 0 4px;padding:0;list-style:none}
  .logs li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;font-size:13.5px;color:var(--muted)}
  .logs .amount{color:var(--ink);font-size:13.5px}
  .settle-line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .badge{
    display:inline-block;font-size:12.5px;font-weight:600;
    background:#E8F3EE;color:var(--green-deep);
    border-radius:99px;padding:4px 10px;
  }
  .linkbtn{background:none;border:none;padding:2px 4px;color:var(--muted);text-decoration:underline;font-size:13px;font-weight:400}
  .linkbtn:hover{color:var(--ink)}

  /* sync strip */
  .sync{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:13px;color:var(--muted);margin-top:10px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#B9BEB7;flex:none}
  .dot.ok{background:var(--green)}
  .dot.err{background:var(--red)}
  .sync input{width:auto;flex:1;min-width:160px;padding:7px 10px;font-size:13.5px}

  /* start screen */
  .start{max-width:460px;margin:9vh auto 0}
  .start .card{padding:22px}
  label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}

  /* confirm panel */
  .confirm{
    background:#FBF1F1;border:1px solid #EAD3D3;border-radius:12px;
    padding:12px 14px;margin-top:12px;
  }
  .confirm p{margin:0 0 10px;font-size:14px}

  /* guilt-free footer */
  .gf{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
  }
  .gf-inner{
    max-width:680px;margin:0 auto;position:relative;overflow:hidden;
    background:var(--green-deep);color:#F4F6F2;
    border-radius:18px 18px 0 0;
    padding:14px 18px 18px;
    box-shadow:0 -6px 24px rgba(15,92,70,.25);
  }
  .gf-inner.neg{background:var(--red-deep);box-shadow:0 -6px 24px rgba(126,43,43,.25)}
  .gf-label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.85}
  .gf-amt{
    font-family:var(--mono);font-weight:600;
    font-size:clamp(30px,9vw,46px);letter-spacing:-.02em;line-height:1.1;
    font-variant-numeric:tabular-nums;
  }
  .gf-amt.pulse{animation:pulse .35s ease}
  @keyframes pulse{50%{transform:scale(1.035)}}
  .gf-tail{font-size:14.5px;opacity:.9}
  .howbtn{
    position:absolute;top:10px;right:12px;
    background:rgba(255,255,255,.12);border:none;color:inherit;
    font-size:12px;font-weight:600;border-radius:99px;padding:5px 11px;
  }
  .howbtn:hover{background:rgba(255,255,255,.22)}
  .breakdown{
    font-family:var(--mono);font-size:13px;margin:0 0 10px;
    border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:10px;
  }
  .breakdown div{display:flex;justify-content:space-between;gap:12px}
  .rosette{
    position:absolute;right:-46px;top:-64px;width:250px;height:250px;
    color:rgba(255,255,255,.16);pointer-events:none;
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>

<script>
"use strict";
/* ---------- money utils (integer cents, no float drift) ---------- */
const fmtEUR = new Intl.NumberFormat("lt-LT",{style:"currency",currency:"EUR"});
const fmt = c => fmtEUR.format(c/100);

function parseMoney(raw){
  if(raw == null) return null;
  let s = String(raw).trim().replace(/[\s€]/g,"");
  if(!s || !/^[\d.,]+$/.test(s)) return null;
  // last "." or "," is the decimal separator; any earlier ones are thousands
  const i = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  let intP = s, dec = "";
  if(i > -1){ intP = s.slice(0,i); dec = s.slice(i+1); }
  intP = intP.replace(/[.,]/g,"");
  if(!/^\d*$/.test(intP) || !/^\d*$/.test(dec) || dec.length > 2) return null;
  if(intP === "" && dec === "") return null;
  const cents = parseInt(intP || "0",10)*100 + parseInt((dec+"00").slice(0,2),10);
  if(!Number.isFinite(cents) || cents <= 0 || cents > 1e9) return null;
  return cents;
}

const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- state ---------- */
let state = null; // {active, monthLabel, salaryCents, fixed[], budgets[], updatedAt}
const ui = { armed:null, armedTimer:null, confirmNewMonth:false, showBreakdown:false,
             email:"", syncMsg:"", err:null };

function blankState(){ return { active:false, updatedAt:0 }; }

// Coerce state loaded from this device or from already-synced cloud state so
// that anything constructed before Extra income existed still satisfies the new
// math. Guilt-free stays derived; we only backfill the missing input array.
function normalize(st){
  if(st && st.active && !Array.isArray(st.extra)) st.extra = [];
  return st;
}

function totals(st){
  const extra = (st.extra||[]).reduce((a,e)=>a+e.cents,0);
  const fixed = st.fixed.reduce((a,f)=>a+f.cents,0);
  let reserved = 0; const per = {};
  for(const b of st.budgets){
    const spent = b.logs.reduce((a,l)=>a+l.cents,0);
    const res = b.settled ? spent : Math.max(b.limitCents, spent);
    per[b.id] = { spent, reserved:res, left:b.limitCents - spent };
    reserved += res;
  }
  return { extra, fixed, reserved, guilt: st.salaryCents + extra - fixed - reserved, per };
}

/* ---------- local persistence (device) ---------- */
const KEY = "gfb-state-v1";
const mem = {};
const ls = (()=>{ try{ const t="__gfb"; localStorage.setItem(t,"1"); localStorage.removeItem(t); return localStorage; }catch(_){ return null; } })();
const artifactStore = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function") ? window.storage : null;

async function loadLocal(){
  if(artifactStore){ try{ const r = await artifactStore.get(KEY); if(r && r.value) return JSON.parse(r.value); }catch(_){/* key missing */} }
  if(ls){ const v = ls.getItem(KEY); if(v){ try{ return JSON.parse(v); }catch(_){} } }
  return mem[KEY] || null;
}
async function saveLocal(st){
  const v = JSON.stringify(st);
  mem[KEY] = st;
  if(ls){ try{ ls.setItem(KEY, v); }catch(_){} }
  if(artifactStore){ try{ await artifactStore.set(KEY, v); }catch(_){} }
}

/* ---------- cloud sync (optional) ---------- */
const configured = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
let sb = null, session = null, pushTimer = null;
let syncState = configured ? "init" : "off"; // off|init|signedout|syncing|ok|error

async function initSync(){
  if(!configured) return;
  try{
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data } = await sb.auth.getSession();
    session = data.session;
    sb.auth.onAuthStateChange((_e, s)=>{ session = s; if(session) pull(); render(); });
    if(session) await pull(); else syncState = "signedout";
  }catch(e){ syncState = "error"; ui.syncMsg = "Sync unavailable: " + e.message; }
  render();
}
async function pull(){
  if(!sb || !session) return;
  syncState = "syncing"; render();
  const { data, error } = await sb.from("budget_state")
    .select("data").eq("user_id", session.user.id).maybeSingle();
  if(error){ syncState = "error"; ui.syncMsg = error.message; }
  else{
    if(data && data.data && (!state || (data.data.updatedAt||0) > (state.updatedAt||0))){
      state = normalize(data.data); await saveLocal(state);
    }else if(state){ schedulePush(); }
    syncState = "ok"; ui.syncMsg = "";
  }
  render();
}
function schedulePush(){ if(!sb || !session) return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 700); }
async function push(){
  if(!sb || !session || !state) return;
  const { error } = await sb.from("budget_state").upsert({
    user_id: session.user.id, data: state, updated_at: new Date().toISOString()
  });
  syncState = error ? "error" : "ok";
  if(error) ui.syncMsg = error.message;
  render();
}
window.addEventListener("focus", ()=>{ if(session) pull(); });

/* ---------- save ---------- */
let lastGuilt = null;
async function commit(){
  state.updatedAt = Date.now();
  await saveLocal(state);
  schedulePush();
  render();
}

/* ---------- rendering ---------- */
const app = document.getElementById("app");

function rosette(){
  let e = "";
  for(let i=0;i<12;i++) e += `<ellipse cx="125" cy="125" rx="108" ry="34" fill="none" stroke="currentColor" stroke-width="1" transform="rotate(${i*15} 125 125)"/>`;
  for(let i=0;i<8;i++)  e += `<ellipse cx="125" cy="125" rx="58"  ry="18" fill="none" stroke="currentColor" stroke-width="1" transform="rotate(${i*22.5+8} 125 125)"/>`;
  return `<svg class="rosette" viewBox="0 0 250 250" aria-hidden="true">${e}</svg>`;
}

function syncStrip(){
  if(!configured) return "";
  if(syncState === "init") return `<div class="sync"><span class="dot"></span>Connecting sync…</div>`;
  if(session){
    const cls = syncState==="error" ? "err" : (syncState==="ok" ? "ok" : "");
    const label = syncState==="syncing" ? "Syncing…" : (syncState==="error" ? "Sync error" : "Synced");
    return `<div class="sync"><span class="dot ${cls}"></span>${label} · ${esc(session.user.email||"")}
      <button class="linkbtn" data-act="sign-out">sign out</button>
      ${ui.syncMsg?`<span class="err">${esc(ui.syncMsg)}</span>`:""}</div>`;
  }
  return `<div class="sync"><span class="dot"></span>
    <input id="email-in" type="email" inputmode="email" placeholder="email for sync" value="${esc(ui.email)}" data-enter="[data-act='send-link']">
    <button class="ghost tiny" data-act="send-link">Send sign-in link</button>
    ${ui.syncMsg?`<span>${esc(ui.syncMsg)}</span>`:""}</div>`;
}

function errFor(anchor){
  return (ui.err && ui.err.anchor===anchor) ? `<div class="err">${esc(ui.err.msg)}</div>` : "";
}

function startScreen(){
  return `
  <div class="start">
    <div class="eyebrow">Guilt-free budget</div>
    <h1>Start a new month</h1>
    <p class="sub">Fixed costs come straight off. Budgets set money aside — settle them to reclaim
    whatever you didn't spend. Everything left is yours, guilt-free.</p>
    <div class="card">
      <label for="salary-in">This month's salary</label>
      <input id="salary-in" class="money" type="text" inputmode="decimal"
             placeholder="e.g. 1450,00" autocomplete="off" data-enter="[data-act='start-month']">
      <div class="hint" id="salary-preview">&nbsp;</div>
      ${errFor("salary")}
      <div class="row" style="margin-top:14px">
        <button class="primary" data-act="start-month" style="flex:1">Start ${esc(currentMonthLabel())}</button>
      </div>
    </div>
    ${syncStrip()}
  </div>`;
}

function currentMonthLabel(){
  const d = new Date();
  return d.toLocaleString("en-GB",{month:"long"}) + " " + d.getFullYear();
}

function budgetCard(b, t){
  const p = t.per[b.id];
  const pct = Math.min(100, b.limitCents ? (p.spent / b.limitCents) * 100 : 100);
  const over = p.spent > b.limitCents;
  const logRows = b.logs.slice().reverse().map(l => `
    <li>
      <span>${l.note ? esc(l.note) : "spent"} <span class="small">· ${new Date(l.ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span></span>
      <span class="row" style="gap:2px">
        <span class="amount">${fmt(l.cents)}</span>
        <button class="x ${ui.armed==="log:"+l.id?"armed":""}" data-act="del-log" data-bid="${b.id}" data-id="${l.id}" aria-label="Remove log">×</button>
      </span>
    </li>`).join("");

  let statusLine;
  if(over) statusLine = `<span class="over">Over by ${fmt(p.spent - b.limitCents)}</span> — the extra came out of guilt-free`;
  else statusLine = `Spent <span class="amount" style="font-size:13.5px">${fmt(p.spent)}</span> · ${fmt(p.left)} left in this budget`;

  let settleArea;
  if(b.settled){
    const badge = over
      ? `<span class="badge">Settled — over by ${fmt(p.spent - b.limitCents)}</span>`
      : `<span class="badge">Settled — ${fmt(p.left)} freed to guilt-free</span>`;
    settleArea = `<div class="settle-line">${badge}
      <button class="linkbtn" data-act="reopen" data-id="${b.id}">Reopen</button></div>
      <p class="small muted" style="margin:6px 0 0">New logs here now come straight out of guilt-free.</p>`;
  }else if(over){
    settleArea = "";
  }else{
    settleArea = `<div class="settle-line">
      <span class="small muted">Done with this budget?</span>
      <button class="ghost tiny" data-act="settle" data-id="${b.id}">Settle · free up ${fmt(p.left)}</button>
    </div>`;
  }

  return `
  <div class="budget">
    <div class="budget-top">
      <span class="budget-name">${esc(b.name)}</span>
      <span class="row" style="gap:4px">
        <span class="limit">Limit ${fmt(b.limitCents)}</span>
        <button class="x ${ui.armed==="budget:"+b.id?"armed":""}" data-act="del-budget" data-id="${b.id}" aria-label="Delete budget">×</button>
      </span>
    </div>
    <div class="bar ${over?"over":""}"><i style="width:${pct}%"></i></div>
    <div class="status">${statusLine}</div>
    ${b.logs.length ? `<ul class="logs">${logRows}</ul>` : ""}
    <div class="row" style="margin-top:8px">
      <input id="log-amt-${b.id}" class="money" type="text" inputmode="decimal" placeholder="0,00"
             style="max-width:110px" data-enter="[data-act='add-log'][data-id='${b.id}']">
      <input id="log-note-${b.id}" type="text" placeholder="note (optional)"
             data-enter="[data-act='add-log'][data-id='${b.id}']">
      <button class="ghost" data-act="add-log" data-id="${b.id}">Log</button>
    </div>
    ${errFor("log:"+b.id)}
    ${settleArea}
  </div>`;
}

function mainScreen(){
  const t = totals(state);
  const extraRows = state.extra.map(x => `
    <div class="item">
      <span class="name">${esc(x.name)}</span>
      <span class="row" style="gap:2px">
        <span class="amount">+${fmt(x.cents)}</span>
        <button class="x ${ui.armed==="extra:"+x.id?"armed":""}" data-act="del-extra" data-id="${x.id}" aria-label="Remove">×</button>
      </span>
    </div>`).join("");
  const fixedRows = state.fixed.map(f => `
    <div class="item">
      <span class="name">${esc(f.name)}</span>
      <span class="row" style="gap:2px">
        <span class="amount">${fmt(f.cents)}</span>
        <button class="x ${ui.armed==="fixed:"+f.id?"armed":""}" data-act="del-fixed" data-id="${f.id}" aria-label="Remove">×</button>
      </span>
    </div>`).join("");

  const neg = t.guilt < 0;
  const confirmPanel = ui.confirmNewMonth ? `
    <div class="confirm">
      <p><strong>Start a new month?</strong> This erases ${esc(state.monthLabel)} — salary, expenses, budgets, everything.</p>
      <div class="row">
        <button class="primary" data-act="confirm-new-month" style="background:var(--red)">Yes, wipe it</button>
        <button class="ghost" data-act="cancel-new-month">Keep it</button>
      </div>
    </div>` : "";

  return `
  <header>
    <div class="topbar">
      <div>
        <div class="eyebrow">Guilt-free budget · ${esc(state.monthLabel)}</div>
        <div class="salaryline" style="margin-top:6px"><span>Salary </span>${fmt(state.salaryCents)}</div>
      </div>
      <button class="ghost" data-act="new-month">Start a new month</button>
    </div>
    ${confirmPanel}
    ${syncStrip()}
  </header>

  <section>
    <div class="sect-head">
      <span class="eyebrow">Extra income</span>
      <span class="sect-note">One-off money on top of your salary.</span>
    </div>
    <div class="card">
      ${extraRows || `<div class="empty">Nothing yet — add a bonus, refund, gift…</div>`}
      <div class="row" style="margin-top:12px">
        <input id="ex-name" type="text" placeholder="Name (e.g. Q2 bonus)" data-enter="[data-act='add-extra']">
        <input id="ex-amt" class="money" type="text" inputmode="decimal" placeholder="0,00" style="max-width:120px" data-enter="[data-act='add-extra']">
        <button class="primary" data-act="add-extra">Add</button>
      </div>
      ${errFor("extra")}
    </div>
  </section>

  <section>
    <div class="sect-head">
      <span class="eyebrow">Fixed expenses</span>
      <span class="sect-note">Comes off your salary immediately.</span>
    </div>
    <div class="card">
      ${fixedRows || `<div class="empty">Nothing yet — add rent, insurance, subscriptions…</div>`}
      <div class="row" style="margin-top:12px">
        <input id="fx-name" type="text" placeholder="Name (e.g. Car rent)" data-enter="[data-act='add-fixed']">
        <input id="fx-amt" class="money" type="text" inputmode="decimal" placeholder="0,00" style="max-width:120px" data-enter="[data-act='add-fixed']">
        <button class="primary" data-act="add-fixed">Add</button>
      </div>
      ${errFor("fixed")}
    </div>
  </section>

  <section>
    <div class="sect-head">
      <span class="eyebrow">Spending budgets</span>
      <span class="sect-note">Money set aside up front. Settle to reclaim what's left.</span>
    </div>
    <div class="card">
      ${state.budgets.length ? state.budgets.map(b => budgetCard(b, t)).join("") : `<div class="empty">Nothing yet — add food, fuel, fun…</div>`}
      <div class="row" style="margin-top:14px;${state.budgets.length?"border-top:1px dashed var(--line);padding-top:14px":""}">
        <input id="bg-name" type="text" placeholder="Name (e.g. Food)" data-enter="[data-act='add-budget']">
        <input id="bg-limit" class="money" type="text" inputmode="decimal" placeholder="limit 0,00" style="max-width:130px" data-enter="[data-act='add-budget']">
        <button class="primary" data-act="add-budget">Add budget</button>
      </div>
      ${errFor("budget")}
    </div>
  </section>

  <footer class="gf">
    <div class="gf-inner ${neg?"neg":""}">
      ${rosette()}
      <button class="howbtn" data-act="toggle-breakdown">${ui.showBreakdown?"Hide":"How?"}</button>
      ${ui.showBreakdown ? `
        <div class="breakdown">
          <div><span>Salary</span><span>${fmt(state.salaryCents)}</span></div>
          <div><span>Extra income</span><span>+${fmt(t.extra)}</span></div>
          <div><span>Fixed expenses</span><span>−${fmt(t.fixed)}</span></div>
          <div><span>Set aside for budgets</span><span>−${fmt(t.reserved)}</span></div>
          <div style="margin-top:4px"><span><strong>Guilt-free</strong></span><span><strong>${fmt(t.guilt)}</strong></span></div>
        </div>` : ""}
      ${neg ? `
        <div class="gf-label">Over budget</div>
        <div class="gf-amt" id="gf-amt">−${fmt(-t.guilt)}</div>
        <div class="gf-tail">No guilt-free money left this month.</div>
      ` : `
        <div class="gf-label">You have</div>
        <div class="gf-amt" id="gf-amt">${fmt(t.guilt)}</div>
        <div class="gf-tail">to spend guilt-free!</div>
      `}
    </div>
  </footer>`;
}

function render(){
  // keep whatever's typed in inputs across re-renders
  const cache = {};
  app.querySelectorAll("input").forEach(i => { if(i.id) cache[i.id] = i.value; });

  app.innerHTML = (state && state.active) ? mainScreen() : startScreen();

  app.querySelectorAll("input").forEach(i => {
    if(i.id && cache[i.id] !== undefined && !i.dataset.fresh) i.value = cache[i.id];
  });

  const sal = document.getElementById("salary-in");
  if(sal){ sal.addEventListener("input", ()=>{
    const c = parseMoney(sal.value);
    document.getElementById("salary-preview").textContent = c ? "= " + fmt(c) : (sal.value.trim() ? "Hmm — try e.g. 1450,00" : "\u00A0");
  }); if(sal.value){ sal.dispatchEvent(new Event("input")); } }

  const em = document.getElementById("email-in");
  if(em) em.addEventListener("input", ()=> ui.email = em.value);

  // pulse the guilt-free number when it changes
  const t = (state && state.active) ? totals(state).guilt : null;
  const el = document.getElementById("gf-amt");
  if(el && lastGuilt !== null && t !== null && t !== lastGuilt) {
    el.classList.add("pulse");
  }
  lastGuilt = t;
}

/* ---------- two-tap delete arming ---------- */
function arm(key){
  if(ui.armed === key){ ui.armed = null; clearTimeout(ui.armedTimer); return true; }
  ui.armed = key;
  clearTimeout(ui.armedTimer);
  ui.armedTimer = setTimeout(()=>{ ui.armed = null; render(); }, 2600);
  render();
  return false;
}
function fail(anchor, msg){ ui.err = {anchor, msg}; render(); }
function clearErr(){ ui.err = null; }

/* ---------- actions ---------- */
document.addEventListener("click", async e=>{
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const act = btn.dataset.act;
  clearErr();

  if(act === "start-month"){
    const c = parseMoney(document.getElementById("salary-in").value);
    if(!c) return fail("salary","Enter a valid amount, e.g. 1450,00");
    state = { active:true, monthLabel: currentMonthLabel(), salaryCents:c,
              extra:[], fixed:[], budgets:[], updatedAt:Date.now() };
    ui.confirmNewMonth = false; lastGuilt = null;
    await commit();
  }
  else if(act === "new-month"){ ui.confirmNewMonth = true; render(); }
  else if(act === "cancel-new-month"){ ui.confirmNewMonth = false; render(); }
  else if(act === "confirm-new-month"){
    state = blankState(); ui.confirmNewMonth = false; lastGuilt = null;
    await commit();
  }
  else if(act === "add-extra"){
    const name = document.getElementById("ex-name").value.trim();
    const c = parseMoney(document.getElementById("ex-amt").value);
    if(!name) return fail("extra","Give it a name.");
    if(!c) return fail("extra","Amount looks off — try e.g. 250,00");
    state.extra.push({id:uid(), name, cents:c});
    document.getElementById("ex-name").value = ""; document.getElementById("ex-amt").value = "";
    await commit();
  }
  else if(act === "del-extra"){
    if(!arm("extra:"+btn.dataset.id)) return;
    state.extra = state.extra.filter(x=>x.id!==btn.dataset.id);
    await commit();
  }
  else if(act === "add-fixed"){
    const name = document.getElementById("fx-name").value.trim();
    const c = parseMoney(document.getElementById("fx-amt").value);
    if(!name) return fail("fixed","Give it a name.");
    if(!c) return fail("fixed","Amount looks off — try e.g. 89,99");
    state.fixed.push({id:uid(), name, cents:c});
    document.getElementById("fx-name").value = ""; document.getElementById("fx-amt").value = "";
    await commit();
  }
  else if(act === "del-fixed"){
    if(!arm("fixed:"+btn.dataset.id)) return;
    state.fixed = state.fixed.filter(f=>f.id!==btn.dataset.id);
    await commit();
  }
  else if(act === "add-budget"){
    const name = document.getElementById("bg-name").value.trim();
    const c = parseMoney(document.getElementById("bg-limit").value);
    if(!name) return fail("budget","Give it a name.");
    if(!c) return fail("budget","Limit looks off — try e.g. 250,00");
    state.budgets.push({id:uid(), name, limitCents:c, settled:false, logs:[]});
    document.getElementById("bg-name").value = ""; document.getElementById("bg-limit").value = "";
    await commit();
  }
  else if(act === "del-budget"){
    if(!arm("budget:"+btn.dataset.id)) return;
    state.budgets = state.budgets.filter(b=>b.id!==btn.dataset.id);
    await commit();
  }
  else if(act === "add-log"){
    const b = state.budgets.find(x=>x.id===btn.dataset.id); if(!b) return;
    const amtEl = document.getElementById("log-amt-"+b.id);
    const noteEl = document.getElementById("log-note-"+b.id);
    const c = parseMoney(amtEl.value);
    if(!c) return fail("log:"+b.id,"Amount looks off — try e.g. 12,40");
    b.logs.push({id:uid(), cents:c, note:noteEl.value.trim(), ts:Date.now()});
    amtEl.value = ""; noteEl.value = "";
    await commit();
  }
  else if(act === "del-log"){
    if(!arm("log:"+btn.dataset.id)) return;
    const b = state.budgets.find(x=>x.id===btn.dataset.bid); if(!b) return;
    b.logs = b.logs.filter(l=>l.id!==btn.dataset.id);
    await commit();
  }
  else if(act === "settle"){
    const b = state.budgets.find(x=>x.id===btn.dataset.id); if(!b) return;
    b.settled = true; await commit();
  }
  else if(act === "reopen"){
    const b = state.budgets.find(x=>x.id===btn.dataset.id); if(!b) return;
    b.settled = false; await commit();
  }
  else if(act === "toggle-breakdown"){ ui.showBreakdown = !ui.showBreakdown; render(); }
  else if(act === "send-link"){
    const email = (document.getElementById("email-in")||{}).value || ui.email;
    if(!email || !email.includes("@")){ ui.syncMsg = "Enter a valid email."; return render(); }
    ui.email = email;
    const { error } = await sb.auth.signInWithOtp({ email,
      options:{ emailRedirectTo: location.href.split("#")[0] } });
    ui.syncMsg = error ? error.message : "Magic link sent — check your inbox.";
    render();
  }
  else if(act === "sign-out"){
    await sb.auth.signOut(); session = null; syncState = "signedout"; render();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const t = e.target.closest("input[data-enter]");
  if(t){ e.preventDefault(); const b = document.querySelector(t.dataset.enter); if(b) b.click(); }
});

/* ---------- boot ---------- */
(async ()=>{
  state = normalize(await loadLocal()) || blankState();
  render();
  initSync();
})();
</script>
</body>
</html>
